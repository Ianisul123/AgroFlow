stages:
  - build
  - test
  - sonar
  - deploy

backend-build:
  stage: build
  script:
    - cd AgroFlow-backend
    - .\gradlew.bat clean bootJar --no-daemon
    - docker build -t agroflow-backend .
  artifacts:
    paths:
      - AgroFlow-backend/build/libs/*.jar
    expire_in: 1 week

backend-test:
  stage: test
  script:
    - cd AgroFlow-backend
    - .\gradlew.bat test jacocoTestReport --no-daemon
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: jacoco
        path: AgroFlow-backend/build/reports/jacoco/test/jacocoTestReport.xml
    paths:
      - AgroFlow-backend/build/reports/jacoco/
      - AgroFlow-backend/build/reports/tests/
      - AgroFlow-backend/build/classes/
    expire_in: 1 week

backend-sonarqube-check:
  stage: sonar
  needs:
    - job: backend-test
      artifacts: true
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - cd AgroFlow-backend
    - .\gradlew.bat sonar --no-daemon "-Dsonar.host.url=http://127.0.0.1:9000" "-Dsonar.token=$env:SONAR_TOKEN" "-Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "demo"'

backend-deploy:
  stage: deploy
  dependencies:
    - backend-build
  script:
    - docker compose up -d --build backend
  resource_group: agroflow-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "demo"'
