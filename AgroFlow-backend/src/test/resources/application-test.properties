# Profilul "test" foloseste o baza de date H2 in-memory in loc de PostgreSQL.
# Asa testele E2E/API pornesc rapid si nu depind de baza de date locala a developerului.
spring.datasource.url=jdbc:h2:mem:agroflow-e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# La fiecare rulare de teste schema este recreata de la zero.
# Acest lucru face testele izolate si previzibile: datele dintr-un test nu raman pentru urmatorul.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Adminul de test este creat automat la pornirea contextului Spring.
# Testele E2E il folosesc pentru a verifica actiunile permise doar rolului ADMIN, cum ar fi stergerea fermelor.
app.admin.name=E2E Admin
app.admin.email=admin-e2e@agroflow.local
app.admin.password=Admin123
