name: agroflow-portfolio

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: AgroFlow
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build: ./AgroFlow-backend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/AgroFlow
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@agroflow.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}"

  frontend:
    build: ./agroflow-frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend